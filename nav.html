<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>우리 아이 맞춤 책 추천 | 그레이트북스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   책육아 내비게이션 — 스타일시트
   포인트: 파랑 #2A88E0 / 서브: 노랑 #FED650
   베이스: 흰색 / 다크텍스트: #383838
   ══════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root {
  /* 포인트 컬러 — 파랑 */
  --blue:        #2A88E0;
  --blue-dark:   #1A6DC0;
  --blue-light:  #E5F3FF;
  --blue-pale:   #F0F8FF;
  --blue-border: #B8D8F5;

  /* 서브 컬러 — 노랑 */
  --yellow:      #FED650;
  --yellow-dark: #F0C020;
  --yellow-light:#FFF9DC;
  --yellow-border:#F5E098;

  /* 베이스 */
  --bg-page:    #FFFFFF;
  --bg-surface: #F5F8FC;
  --bg-card:    #FFFFFF;

  /* 텍스트 */
  --text-dark:  #383838;
  --text-mid:   #6B6B6B;
  --text-light: #A0A0A0;

  /* 보더 */
  --border:     #E8EDF2;
  --border-mid: #D0D8E0;

  /* 그림자 */
  --shadow-sm:  0 2px 8px rgba(42,136,224,.08);
  --shadow-md:  0 4px 20px rgba(42,136,224,.12);
  --shadow-yellow: 0 4px 14px rgba(254,214,80,.40);
}

/* ── 리셋 ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html {
  height: -webkit-fill-available;
}
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg-page);
  color: var(--text-dark);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  padding: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── 전체 래퍼 ── */
.gb-content { padding: 0 0 22px; max-width: 560px; margin: 0 auto; }
.ww + .gb-content { padding-top: 0; }
#app { width: 100%; padding: 0; }
#app:has(.ww) { padding: 0; }          /* 인트로: 양옆 0 */
#app:not(:has(.ww)) { padding: 0 18px 22px; } /* 그 외: 양옆 18px */

/* ══════════════════════════════════════════════
   헤더 — 흰 배경, CI 로고 가운데
   ══════════════════════════════════════════════ */
.gb-header {
  background: #ffffff;
  padding: 14px 18px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: sticky;
  top: 0;
  z-index: 10;
  width: 100%;
  border-bottom: 1px solid var(--border);
}
.gb-logo-img {
  height: 28px;
  width: auto;
  display: block;
  filter: none;          /* 흰 배경이므로 원본 색상 그대로 */
}

/* ══════════════════════════════════════════════
   웰컴 화면 — 책육아 내비게이션
   ══════════════════════════════════════════════ */
.ww { padding: 0; overflow: visible; }

/* ─ 상단 인트로 블록 ─ */
.w-intro {
  text-align: center;
  padding: 16px 24px 0;
}
.w-intro-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.w-intro-headline {
  font-size: 22px;
  font-weight: 900;
  color: var(--text-dark);
  line-height: 1.4;
  margin-bottom: 8px;
}
.w-intro-headline em {
  color: var(--blue);
  font-style: normal;
}
.w-intro-sub {
  font-size: 13px;
  color: var(--text-mid);
  line-height: 1.65;
  margin-bottom: 14px;
}

/* ─ 드라이빙 로드 섹션 ─ */
.w-road-wrap {
  position: relative;
  width: calc(100% + 36px);
  margin-left: -18px;
  overflow: visible;
  background: var(--blue-light);
  padding: 12px 0 0;
  margin-bottom: 12px;
}

/* 도로 */
.w-road {
  position: relative;
  height: 90px;
  margin: 0 0 0;
  overflow: visible;
}

/* 하늘 배경 */
.w-sky {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  background: var(--blue-light);
}

/* 도로 면 */
.w-asphalt {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 44px;
  background: var(--blue);
  border-radius: 0;
}

/* 도로 중앙선 */
.w-road-line {
  position: absolute;
  bottom: 18px;
  left: 0; right: 0;
  height: 4px;
  display: flex;
  gap: 0;
  overflow: hidden;
}
.w-road-dash {
  width: 32px;
  height: 4px;
  background: var(--yellow);
  flex-shrink: 0;
  margin-right: 20px;
  border-radius: 2px;
  opacity: .7;
}

/* 스텝 체크포인트 깃발 */
.w-flags {
  position: absolute;
  bottom: 44px;
  left: 0; right: 0;
  display: flex;
  justify-content: space-around;
  padding: 0 8%;
  align-items: flex-end;
}
.w-flag-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.w-flag-pole {
  width: 2px;
  height: 20px;
  background: var(--text-mid);
  opacity: .4;
}
.w-flag-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  border: 2px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
  margin-bottom: 2px;
}
.w-flag-dot.done {
  background: var(--yellow);
  border-color: var(--yellow-dark);
}
.w-flag-dot.current {
  background: var(--blue);
  border-color: #fff;
  box-shadow: 0 0 0 3px rgba(42,136,224,.25);
}
.w-flag-num {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-light);
  margin-top: 3px;
}

/* 병아리 차 */
.w-car {
  position: absolute;
  bottom: 44px;
  transition: left .6s cubic-bezier(.34,1.56,.64,1);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 5;
}
.w-chick-body {
  width: 52px;
  height: 52px;
  position: relative;
}
/* 차체 */
.w-car-body {
  width: 68px;
  height: 32px;
  background: var(--yellow);
  border-radius: 10px 10px 4px 4px;
  position: relative;
  box-shadow: 0 3px 8px rgba(0,0,0,.15);
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 병아리 얼굴 (위에 올라탐) */
.w-chick-face {
  position: absolute;
  top: -34px;
  left: 50%;
  transform: translateX(-50%);
  width: 44px;
  height: 44px;
  background: var(--yellow);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  font-size: 24px;
  line-height: 1;
  flex-direction: column;
}
/* 바퀴 */
.w-wheels {
  display: flex;
  justify-content: space-between;
  width: 56px;
  margin-top: -6px;
  padding: 0 4px;
}
.w-wheel {
  width: 16px;
  height: 16px;
  background: var(--text-dark);
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}

/* 스텝 라벨 (도로 아래) */
.w-step-labels {
  display: flex;
  justify-content: space-around;
  padding: 8px 8% 12px;
  background: var(--blue-light);
}
.w-step-label-item {
  font-size: 9px;
  font-weight: 700;
  color: var(--blue-dark);
  text-align: center;
  opacity: .7;
  letter-spacing: .02em;
}
.w-step-label-item.active {
  color: var(--blue);
  opacity: 1;
}

/* 피처 박스 */
.fbox {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 3px 0;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.fr { display: flex; align-items: flex-start; gap: 11px; padding: 12px 16px; }
.fr:not(:last-child) { border-bottom: 1px solid var(--border); }
.fi {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--blue-light);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.fi svg { width: 12px; height: 12px; }
.ft { font-size: 13px; color: var(--text-mid); line-height: 1.5; }
.ft strong { font-weight: 700; color: var(--text-dark); }

/* 시작 버튼 */
.btn-go {
  display: block;
  width: 100%;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 17px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: background .18s, box-shadow .18s, transform .1s;
  box-shadow: var(--shadow-md);
  letter-spacing: .02em;
}
.btn-go:hover  { background: var(--blue-dark); }
.btn-go:active { transform: scale(.98); }

/* ══════════════════════════════════════════════
   프로그레스 바
   ══════════════════════════════════════════════ */
.pw { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-top: 18px; }
.bk {
  background: none; border: none; cursor: pointer;
  color: var(--text-light); font-size: 13px; font-family: inherit;
  padding: 4px 0; display: flex; align-items: center; gap: 4px;
  flex-shrink: 0; transition: color .15s;
}
.bk:hover { color: var(--blue); }
.bk svg { width: 15px; height: 15px; }
.pb {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: visible;   /* 병아리가 위로 튀어나와야 함 */
  position: relative;
}
.pf {
  height: 100%;
  border-radius: 2px;
  transition: width .55s cubic-bezier(.34,1.56,.64,1);
  position: relative;
}
.pf.pc  { background: var(--blue); }
.pf.pb2 { background: var(--blue); opacity: .65; }
.pf.pm  { background: var(--blue-dark); }

/* ── 병아리 자동차 (프로그레스 바 위) ── */
.pb-car {
  position: absolute;
  right: -14px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  animation: pbCarBounce .55s cubic-bezier(.34,1.56,.64,1) 1;
}
@keyframes pbCarBounce {
  0%   { transform: translateY(-50%) scale(.85); }
  40%  { transform: translateY(calc(-50% - 6px)) scale(1.08); }
  70%  { transform: translateY(calc(-50% + 2px)) scale(.97); }
  100% { transform: translateY(-50%) scale(1); }
}
.pb-car-face {
  width: 20px;
  height: 20px;
  background: var(--yellow);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  line-height: 1;
  box-shadow: 0 1px 4px rgba(0,0,0,.15);
  position: relative;
  z-index: 2;
}
.pb-car-body {
  width: 26px;
  height: 11px;
  background: var(--yellow);
  border-radius: 4px 4px 2px 2px;
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
  margin-top: -2px;
  position: relative;
  z-index: 2;
}
.pb-car-wheels {
  display: flex;
  justify-content: space-between;
  width: 22px;
  margin-top: -3px;
}
.pb-car-wheel {
  width: 7px;
  height: 7px;
  background: #383838;
  border-radius: 50%;
  border: 1.5px solid #fff;
}

/* ══════════════════════════════════════════════
   스텝 태그
   ══════════════════════════════════════════════ */
.stag {
  font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
}
.sd { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.stag.tc { color: var(--blue); }       .stag.tc .sd { background: var(--blue); }
.stag.tb { color: var(--blue); }       .stag.tb .sd { background: var(--blue); opacity: .6; }
.stag.tm { color: var(--blue-dark); }  .stag.tm .sd { background: var(--blue-dark); }

/* 질문·힌트 */
.sq { font-size: 20px; font-weight: 700; color: var(--text-dark); line-height: 1.45; margin-bottom: 6px; }
.sh { font-size: 13px; color: var(--text-mid); line-height: 1.65; margin-bottom: 18px; }

/* ══════════════════════════════════════════════
   발달 이정표 카드
   ══════════════════════════════════════════════ */
.dev-card {
  background: var(--blue-pale);
  border: 1px solid var(--blue-border);
  border-radius: 12px;
  padding: 12px 15px;
  margin-bottom: 16px;
}
.dev-title {
  font-size: 10px; font-weight: 700; color: var(--blue);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 7px; display: flex; align-items: center; gap: 5px;
}
.dev-title svg { width: 12px; height: 12px; }
.dev-items { display: flex; flex-direction: column; gap: 5px; }
.dev-item {
  font-size: 12px; color: var(--text-mid); line-height: 1.55;
  display: flex; align-items: baseline; gap: 7px;
}
.dev-item::before {
  content: ''; width: 4px; height: 4px; border-radius: 50%;
  background: var(--blue); flex-shrink: 0; margin-top: 5px;
}

/* ══════════════════════════════════════════════
   배너
   ══════════════════════════════════════════════ */
.ban {
  border-radius: 12px; padding: 12px 15px; margin-bottom: 16px;
  display: flex; align-items: flex-start; gap: 10px;
  border: 1px solid var(--blue-border);
  background: var(--blue-pale);
}
.bni {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--blue-light);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.bni svg { width: 13px; height: 13px; }
.bnt { font-size: 12px; line-height: 1.55; color: var(--text-mid); }
.bnt strong { font-weight: 700; color: var(--blue-dark); }

/* ══════════════════════════════════════════════
   옵션 카드
   ══════════════════════════════════════════════ */
.og { display: grid; gap: 9px; margin-bottom: 22px; }
.og.g2 { grid-template-columns: 1fr 1fr; }
.og.g1 { grid-template-columns: 1fr; }
.oc {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 15px;
  cursor: pointer; text-align: left;
  transition: border-color .18s, box-shadow .18s, background .15s;
  box-shadow: var(--shadow-sm);
}
.oc:hover.hc,
.oc:hover.hb,
.oc:hover.hm {
  border-color: var(--blue);
  background: var(--blue-pale);
  box-shadow: 0 0 0 3px rgba(42,136,224,.10), var(--shadow-sm);
}
.oc.sp2 { grid-column: 1 / -1; }
.obs {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700;
  padding: 2px 9px; border-radius: 20px; margin-bottom: 6px;
  letter-spacing: .04em;
  color: var(--blue); background: var(--blue-light);
}
.ot  { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 3px; line-height: 1.35; }
.os2 { font-size: 12px; color: var(--text-mid); line-height: 1.5; }

/* ══════════════════════════════════════════════
   결과 화면
   ══════════════════════════════════════════════ */
.rh { text-align: center; padding: 16px 0 20px; }
.rck {
  width: 52px; height: 52px;
  background: var(--blue-light);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
  box-shadow: 0 4px 12px rgba(42,136,224,.18);
}
.rck svg { width: 26px; height: 26px; }
.rt { font-size: 20px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; }
.rs { font-size: 13px; color: var(--text-mid); line-height: 1.65; padding: 0 8px; }
.mp { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 13px; border-radius: 20px; margin-top: 9px; }
.mp.hit { background: var(--blue-light); color: var(--blue); }
.mp.ok  { background: var(--bg-surface); color: var(--text-mid); }

/* 보완 박스 */
.comp-box {
  background: var(--blue-pale); border: 1px solid var(--blue-border);
  border-radius: 11px; padding: 11px 14px; margin-bottom: 14px;
  display: flex; gap: 9px; align-items: flex-start;
}
.comp-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.comp-txt { font-size: 12px; color: var(--text-mid); line-height: 1.55; }
.comp-txt strong { font-weight: 700; color: var(--blue-dark); }

/* 소셜 프루프 */
.sp-box {
  background: var(--bg-surface);
  border-left: 3px solid var(--blue);
  border-radius: 0 10px 10px 0;
  padding: 10px 14px; margin-bottom: 12px;
}
.sp-q { font-size: 13px; color: var(--text-dark); line-height: 1.6; font-style: italic; }
.sp-q::before { content: '\201C'; color: var(--blue); font-weight: 700; font-style: normal; font-size: 16px; }
.sp-q::after  { content: '\201D'; color: var(--blue); font-weight: 700; font-style: normal; font-size: 16px; }
.sp-src { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* 제품 카드 */
.pc {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 16px; padding: 18px; margin-bottom: 10px;
  box-shadow: var(--shadow-sm); transition: box-shadow .18s;
}
.pc.prime { border-color: var(--blue); box-shadow: 0 4px 16px rgba(42,136,224,.14); }
.bdr { margin-bottom: 9px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bdp { font-size: 11px; font-weight: 700; color: var(--blue); background: var(--blue-light); padding: 3px 10px; border-radius: 20px; }
.bda { font-size: 11px; font-weight: 700; color: var(--text-mid); background: var(--bg-surface); padding: 3px 10px; border-radius: 20px; }
.pnm { font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
.ptg { font-size: 12px; color: var(--text-mid); margin-bottom: 10px; }
.pm  { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 13px; }
.mt  { font-size: 11px; color: var(--text-mid); background: var(--bg-surface); padding: 2px 9px; border-radius: 20px; }
.mt.sp2 { color: var(--blue); background: var(--blue-light); }

/* 발달 연결점 */
.dev-result {
  background: var(--blue-pale); border-radius: 10px;
  padding: 11px 14px; margin-bottom: 13px;
  border: 1px solid var(--blue-border);
}
.dev-rt { font-size: 10px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.dev-ritem { font-size: 12px; color: var(--text-mid); line-height: 1.5; padding-left: 14px; position: relative; margin-bottom: 3px; }
.dev-ritem::before { content: '→'; position: absolute; left: 0; color: var(--blue); font-size: 11px; top: 1px; }

/* 추천 이유 */
.wb2 { border-left: 3px solid var(--blue-border); padding-left: 13px; margin-bottom: 15px; }
.wl  { font-size: 10px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.wt2 { font-size: 13px; color: var(--text-mid); line-height: 1.65; }

/* 제품 상세보기 버튼 */
.bv {
  display: block; width: 100%;
  background: var(--blue); color: #fff;
  border: none; border-radius: 10px; padding: 13px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  text-align: center; text-decoration: none;
  transition: background .18s; letter-spacing: .02em;
}
.bv:hover { background: var(--blue-dark); }

/* 다시하기 버튼 */
.br2 {
  display: block; width: 100%;
  background: transparent; color: var(--text-mid);
  border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px;
  font-family: inherit; font-size: 13px; cursor: pointer;
  text-align: center; margin-top: 8px;
  transition: background .15s, border-color .15s;
}
.br2:hover { background: var(--blue-pale); border-color: var(--blue-border); }

function computeRec(cands,style,tempType,readStyle,ownKey){
  const own=OWN_COMP[ownKey]||OWN_COMP.none;
  let pool=cands.filter(p=>!own.skip.includes(p));
  if(pool.length===0)pool=[...cands];
  if(tempType!=='normal'&&TEMP_BOOST[tempType]){const b=TEMP_BOOST[tempType];pool.sort((a,b2)=>(b.has(b2)?1:0)-(b.has(a)?1:0))}
  if(own.boost.size>0)pool.sort((a,b)=>(own.boost.has(b)?1:0)-(own.boost.has(a)?1:0));
  if(readStyle==='saypen')pool.sort((a,b)=>(SAYPEN_SET.has(b)?1:0)-(SAYPEN_SET.has(a)?1:0));
  const pref=STYLE[style].match;
  const matched=pool.filter(p=>pref.has(p));
  const unmatched=pool.filter(p=>!pref.has(p));
  const ordered=[...matched,...unmatched].slice(0,2);
  const isMatch=matched.length>0;
  let msg=isMatch?'아이 특성과 엄마 취향이 모두 맞는 추천이에요!':'아이 발달과 기질을 최우선으로 선별했어요.';
  if(readStyle==='saypen'&&ordered.some(p=>P[p]?.saypen))msg+=' 세이펜을 지원해 혼자 듣는 시간도 활용 가능해요.';
  if(readStyle==='together')msg+=' 엄마가 읽어주는 교감이 이 책의 효과를 두 배로 만들어줘요.';
  return{pids:ordered,msg,matchType:isMatch?'hit':'ok',compNote:own.note,tempType};
}

function renderAge(){
  curOpts=AGE_STEP.opts;const n=curOpts.length;
  const cards=curOpts.map((o,i)=>{const sp=i===n-1&&n%2!==0?' sp2':'';return`<div class="oc hc${sp}" onclick="doAge(${i})"><div class="ot">${o.t}</div><div class="os2">${o.s}</div></div>`;}).join('');
  return`${bar(AGE_STEP.pct,'pm')}<div class="stag tc"><div class="sd"></div>STEP 1 — 아이 월령</div><div class="sq">아이가 몇 개월이에요?</div><p class="sh">월령에 따라 발달 단계가 달라져요. 현재 기준으로 선택해 주세요.</p><div class="og g2">${cards}</div>`;
}

function renderInt(key){
  const s=INT[key];curOpts=s.opts;const n=s.opts.length;const cls=n>=5?' g1':' g2';
  const cards=s.opts.map((o,i)=>`<div class="oc hc" onclick="doInt(${i})"><div class="ot">${o.t}</div><div class="os2">${o.s}</div></div>`).join('');
  return`${bar(s.pct,'pm')}${devCard(S.ageKey)}<div class="stag tc"><div class="sd"></div>STEP 2 — 아이 관심사</div><div class="sq">요즘 아이가 가장 빠져있는 게 뭐예요?</div><p class="sh">관심 분야에 따라 아이가 빠져들 책이 달라져요.</p><div class="og${cls}">${cards}</div>`;
}

function renderTemp(){
  const descSet=TEMP_DESC[S.ageKey]||TEMP_DESC['25~36'];
  const keys=['sensitive','excitable','easygoing','refuse'];
  const cards=keys.map((k,i)=>{const d=descSet[k];return`<div class="oc hb" onclick="doTemp(${i})"><div class="ot">${d.t}</div><div class="os2">${d.s}</div></div>`;}).join('');
  return`${bar(42,'pm')}
<div class="ban bb"><div class="bni nbb">${BRAIN_I}</div><div class="bnt bb"><strong>${S.ageKey}개월 아이</strong>도 기질에 따라 책 반응이 완전히 달라요. 지금 우리 아이와 가장 비슷한 걸 선택해 주세요.</div></div>
<div class="stag tb"><div class="sd"></div>STEP 3 — 아이 기질</div>
<div class="sq">아이 성향을 한 가지만 고른다면?</div>
<p class="sh">맘카페에서 가장 자주 등장하는 고민이에요. 기질에 따라 같은 책도 반응이 완전히 달라져요.</p>
<div class="og g1">${cards}</div>`;
}

function renderOwn(){
  const cards=OWN_Q.opts.map((o,i)=>`<div class="oc hb" onclick="doOwn(${i})"><div class="ot">${o.t}</div><div class="os2">${o.s}</div></div>`).join('');
  return`${bar(OWN_Q.pct,'pm')}
<div class="ban bb"><div class="bni nbb">${BOOK_I}</div><div class="bnt bb"><strong>보유 전집 확인!</strong><br>이미 있는 전집과 겹치지 않도록 꼭 필요한 영역을 보완해 드려요.</div></div>
<div class="stag tb"><div class="sd"></div>STEP 4 — 보유 전집</div>
<div class="sq">이미 갖고 있는 전집 종류가 있나요?</div>
<p class="sh">"자연관찰 이미 있는데 뭐 살까?" — 맘카페 단골 고민을 여기서 해결해 드려요!</p>
<div class="og g1">${cards}</div>`;
}

function renderRead(){
  const cards=READ_Q.opts.map((o,i)=>`<div class="oc hb" onclick="doRead(${i})"><div class="ot">${o.t}</div><div class="os2">${o.s}</div></div>`).join('');
  return`${bar(READ_Q.pct,'pm')}
<div class="ban bb"><div class="bni nbb">${BOOK_I}</div><div class="bnt bb"><strong>독서 환경</strong>을 알려주세요.<br>실제 생활 방식에 맞는 책이 훨씬 잘 활용돼요.</div></div>
<div class="stag tb"><div class="sd"></div>STEP 5 — 독서 환경</div>
<div class="sq">평소 아이에게 책을 어떻게 읽어주세요?</div>
<p class="sh">솔직하게 선택해 주세요. 어느 쪽이든 잘 맞는 책이 있어요!</p>
<div class="og g1">${cards}</div>`;
}

function renderMom(){
  const cards=MOM_Q.opts.map((o,i)=>`<div class="oc hm" onclick="doMom(${i})"><div><span class="obs ${o.badge}">${o.bl}</span></div><div class="ot">${o.t}</div><div class="os2">${o.s}</div></div>`).join('');
  return`${bar(MOM_Q.pct,'pm')}
<div class="ban bm"><div class="bni nbm">${USER_I}</div><div class="bnt bm"><strong>거의 다 됐어요!</strong> 마지막으로 엄마 취향을 알려주세요.<br>같은 조건이라도 엄마 스타일에 따라 딱 맞는 책이 달라져요.</div></div>
<div class="stag tm"><div class="sd"></div>STEP 6 — 엄마 취향</div>
<div class="sq">어떤 스타일의 책이 엄마 마음에 드세요?</div>
<p class="sh">아이와 함께 오래 보는 책이니까, 엄마 취향도 중요해요!</p>
<div class="og g1">${cards}</div>`;
}

function renderRes(){
  const d=window.__res;if(!d)return'';
  const{pids,msg,matchType,compNote}=d;
  const style=S.momStyle;
  const reviewKey=S.tempReviewKey||S.tempType;
  const compBanner=compNote?`<div class="comp-box"><div class="comp-icon">💡</div><div class="comp-txt"><strong>보완 추천 적용됨</strong><br>${compNote}</div></div>`:'';
  const cards=pids.map((pid,i)=>{
    const p=P[pid];if(!p)return'';
    const first=i===0;
    const spTag=p.saypen?`<span class="mt sp2">세이펜</span>`:'';
    const reviewTxt=p.review?.[reviewKey]||p.review?.easygoing||'';
    const devItems=(DEV_MAP[p.devAge]||[]).slice(0,2);
    const whyTxt=buildWhyText(pid,S)||p.why[style]||p.why.story;
    return`<div class="pc${first?' prime':''}">
<div class="bdr">${first?'<span class="bdp">첫 번째 추천</span>':'<span class="bda">함께 보면 더 좋아요</span>'}</div>
<div class="pnm">${p.name}</div><div class="ptg">${p.tagline}</div>
<div class="pm"><span class="mt">${p.age}</span><span class="mt">${p.area}</span><span class="mt">${p.label}</span>${spTag}</div>
${reviewTxt?`<div class="sp-box"><div class="sp-q">${reviewTxt}</div><div class="sp-src">${p.reviewSrc}</div></div>`:''}
${devItems.length?`<div class="dev-result"><div class="dev-rt">이 책을 지금 만나야 하는 이유</div>${devItems.map(di=>`<div class="dev-ritem">${di}</div>`).join('')}</div>`:''}
<div class="wb2"><div class="wl">이 책을 추천하는 이유</div><div class="wt2">${whyTxt}</div></div>
<a class="bv" href="${p.url}" target="_blank" rel="noopener">제품 자세히 보기 →</a>
</div>`;
  }).join(pids.length>1?'<div class="dv">+ 함께 보면 좋아요</div>':'');
  const CTA_URL='https://www.greatbooks.co.kr/consulting/request';
  return`<div class="rh"><div class="rck">${CHK}</div><div class="rt">6단계 맞춤 추천 완료!</div><div class="rs">${msg}</div><div><span class="mp ${matchType==='hit'?'hit':'ok'}">${matchType==='hit'?'선택하신 내용 기반 맞춤 추천':'아이 기질 기반 추천'}</span></div></div>
${compBanner}${cards}
<div class="ref-note"><strong>이 추천은 6가지 답변을 바탕으로 한 참고용 결과예요.</strong></div>
<div class="cta-wrap-v2">
  <div class="cta-bottom" style="border-radius:16px;border:1px solid var(--border)">
    <div style="font-size:13px;color:var(--text-mid);margin-bottom:12px;text-align:center">전문가와 더 깊은 상담을 원하신다면</div>
    <a class="cta-btn-v2" href="${CTA_URL}" target="_blank" rel="noopener">상담 신청하기 →</a>
  </div>
</div>
<div class="rw"><button class="br2" onclick="doRestart()">← 처음부터 다시 해보기</button></div>`;
}

function render(){
  let h='';
  if(cur==='welcome')h=renderWelcome();
  else if(cur==='__res__')h=renderRes();
  else if(cur==='age')h=renderAge();
  else if(cur==='q_temp')h=renderTemp();
  else if(cur==='q_own')h=renderOwn();
  else if(cur==='q_read')h=renderRead();
  else if(cur==='q_mom')h=renderMom();
  else if(INT[cur])h=renderInt(cur);
  else h='<p style="color:#6B6B66;padding:20px">오류가 발생했어요.</p>';
  document.getElementById('app').innerHTML=h;
  /* 페이지 전환마다 맨 위로 스크롤 — 이전 버튼 오작동 방지 */
  window.scrollTo({top:0,behavior:'instant'});
  /* 페이지 전환마다 병아리 바운스 재실행 */
  const car=document.querySelector('.pb-car');
  if(car){car.style.animation='none';requestAnimationFrame(()=>{car.style.animation='';});}
}
render();
</script>
</body></html>
